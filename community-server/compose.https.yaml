services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      COMMUNITY_API_DOMAIN: ${COMMUNITY_API_DOMAIN:?Set the public API hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      community:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
